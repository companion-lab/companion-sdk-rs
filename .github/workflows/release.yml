# Publish companion-plugin-sdk to crates.io + create the GitHub release.
#
# Primary flow: run "Prepare release" — it bumps Cargo.toml (syncing
# Cargo.lock), commits, tags, and calls this workflow to publish.
#
# Manual flow: bump Cargo.toml, commit, then
#
#   git tag v0.4.0 && git push origin v0.4.0
#
# `workflow_dispatch` publishes the committed version without a tag (crates.io
# rejects duplicate versions anyway). Tag-push and prepare-release runs create
# a GitHub release with generated notes.
#
# Requires the CARGO_API_TOKEN secret (crates.io -> Account Settings ->
# API Tokens, publish-write scope for companion-plugin-sdk).

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Called by prepare-release.yml after the version bump commit; publish
  # logic lives here so both paths share guards + publish steps.
  workflow_call:
    inputs:
      ref:
        description: "Commit to check out (Prepare release passes the bumped commit)"
        required: false
        type: string
      tag:
        description: "Tag name for the GitHub release (Prepare release passes v<version>)"
        required: false
        type: string
      create_release:
        description: "Create the GitHub release after publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches crate version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(cargo metadata --quiet --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - name: Publish dry run
        run: cargo publish --dry-run

      - name: Publish to crates.io
        run: cargo publish
        env:
          # cargo only reads CARGO_REGISTRY_TOKEN (or legacy CARGO_TOKEN) —
          # the secret is named CARGO_API_TOKEN, so remap it here.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}

      - name: Create GitHub release
        if: github.event_name == 'push' || inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
